server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /_health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /api/leads {
        limit_except POST { deny all; }
        client_max_body_size 32k;
        proxy_pass https://crm.fonilgroup.com.br/api/webhooks/leads/cmpylrvkv000376i6bzhsl1lo;
        proxy_ssl_server_name on;
        proxy_set_header Host crm.fonilgroup.com.br;
        proxy_connect_timeout 10s;
        proxy_read_timeout 20s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
